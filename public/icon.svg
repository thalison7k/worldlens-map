<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0" stop-color="#16213e"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="sphere" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.42" stop-color="#22d3ee"/>
      <stop offset="0.78" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0b1024"/>
    </radialGradient>
    <radialGradient id="spec" cx="30%" cy="24%" r="30%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="0.82" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.9"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="256" cy="256" r="168"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="168" fill="url(#sphere)"/>
    <g clip-path="url(#clip)" stroke="#e0f2fe" fill="none" opacity="0.55">
      <ellipse cx="256" cy="256" rx="168" ry="52" stroke-width="5"/>
      <ellipse cx="256" cy="256" rx="150" ry="115" stroke-width="4" opacity="0.6"/>
      <ellipse cx="256" cy="186" rx="132" ry="34" stroke-width="3.5" opacity="0.45"/>
      <ellipse cx="256" cy="326" rx="132" ry="34" stroke-width="3.5" opacity="0.45"/>
      <ellipse cx="256" cy="256" rx="168" ry="168" stroke-width="4.5" opacity="0.7">
        <animate attributeName="rx" dur="7s" repeatCount="indefinite" values="168;18;168;18;168" keyTimes="0;0.25;0.5;0.75;1"/>
      </ellipse>
      <ellipse cx="256" cy="256" rx="168" ry="168" stroke-width="4.5" opacity="0.7">
        <animate attributeName="rx" dur="7s" begin="-2.3s" repeatCount="indefinite" values="168;18;168;18;168" keyTimes="0;0.25;0.5;0.75;1"/>
      </ellipse>
      <ellipse cx="256" cy="256" rx="168" ry="168" stroke-width="4.5" opacity="0.7">
        <animate attributeName="rx" dur="7s" begin="-4.6s" repeatCount="indefinite" values="168;18;168;18;168" keyTimes="0;0.25;0.5;0.75;1"/>
      </ellipse>
      <ellipse cx="352" cy="264" rx="196" ry="180" fill="#04070f" opacity="0.35" stroke="none"/>
    </g>
    <circle cx="256" cy="256" r="168" fill="url(#spec)"/>
    <circle cx="256" cy="256" r="168" fill="url(#rim)"/>
    <circle cx="256" cy="256" r="168" fill="none" stroke="#67e8f9" stroke-width="5"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="9s" repeatCount="indefinite"/>
    <g transform="rotate(-24 256 256)">
      <ellipse cx="256" cy="256" rx="212" ry="78" fill="none" stroke="#a78bfa" stroke-width="6" opacity="0.55"/>
      <circle cx="468" cy="256" r="16" fill="#f0abfc"/>
    </g>
  </g>
</svg>
